[project]
name = "tg-ads-bot"
version = "0.1.0"
description = "Automatic portfolio manager for Telegram Ads"
authors = [{name = "Sherif Ragimov"}]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "aiogram>=3.22,<4",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "greenlet>=3.2,<4",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
pytest-asyncio = ">=1.1,<2"
ruff = ">=0.13,<1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
